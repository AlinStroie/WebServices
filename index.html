<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>A Squared Studio - Creare site-uri web</title>
    <meta
      name="description"
      content="Creare site-uri de prezentare, landing page-uri, portofolii și website-uri moderne pentru afaceri locale."
    />

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.08), transparent 34%),
          #030303;
        color: white;
        transition:
          opacity 0.55s ease,
          visibility 0.55s ease;
      }

      #initial-loader.loader-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .loader-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .loader-logo {
        display: flex;
        height: 56px;
        width: 56px;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background: white;
        color: black;
        font-family: Inter, system-ui, sans-serif;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: -0.08em;
        box-shadow: 0 24px 90px rgba(255, 255, 255, 0.14);
        animation: logoFloat 1.4s ease-in-out infinite;
      }

      .loader-text {
        font-family: Inter, system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.65);
      }

      .loader-line {
        position: relative;
        height: 3px;
        width: 130px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
      }

      .loader-line::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: inherit;
        background: white;
        animation: loadingLine 1.1s ease-in-out infinite;
      }

      @keyframes loadingLine {
        0% {
          transform: translateX(-110%);
        }

        100% {
          transform: translateX(260%);
        }
      }

      @keyframes logoFloat {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }

        50% {
          transform: translateY(-4px) scale(1.03);
        }
      }
    </style>
  </head>

  <body>
    <div id="initial-loader">
      <div class="loader-card">
        <div class="loader-logo">A²</div>
        <div class="loader-line"></div>
        <div class="loader-text">Se încarcă experiența</div>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
