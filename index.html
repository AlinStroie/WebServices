<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030303" />
    <meta name="robots" content="index, follow" />

    <title>A Squared Studio - Creare site-uri web</title>
    <meta
      name="description"
      content="Creare site-uri de prezentare, landing page-uri și portofolii responsive pentru afaceri care vor o imagine profesională online."
    />
    <meta
      name="keywords"
      content="creare site web, site de prezentare, landing page, web design, portofoliu, SEO basic, mentenanță website"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://example.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="A Squared Studio" />
    <meta property="og:title" content="A Squared Studio - Creare site-uri web" />
    <meta
      property="og:description"
      content="Site-uri clare, rapide și bine structurate pentru afaceri care vor o prezență online profesionistă."
    />
    <meta property="og:image" content="/banner site.svg" />
    <meta property="og:locale" content="ro_RO" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A Squared Studio - Creare site-uri web" />
    <meta
      name="twitter:description"
      content="Site-uri clare, rapide și bine structurate pentru afaceri care vor o prezență online profesionistă."
    />
    <meta name="twitter:image" content="/banner site.svg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "A Squared Studio",
        "description": "Creare site-uri de prezentare, landing page-uri și portofolii responsive."
      }
    </script>

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.08), transparent 34%),
          #030303;
        color: white;
        transition:
          opacity 0.45s ease,
          visibility 0.45s ease;
      }

      #initial-loader.loader-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .loader-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .loader-logo {
        display: flex;
        height: 56px;
        width: 56px;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background: white;
        color: black;
        font-family: Inter, system-ui, sans-serif;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: -0.08em;
        box-shadow: 0 24px 90px rgba(255, 255, 255, 0.14);
      }

      .loader-text {
        font-family: Inter, system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.65);
      }
    </style>
  </head>

  <body>
    <div id="initial-loader">
      <div class="loader-card">
        <div class="loader-logo">A²</div>
        <div class="loader-text">Se încarcă experiența</div>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
