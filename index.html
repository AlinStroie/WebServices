<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030303" />
    <meta name="robots" content="index, follow" />

    <title>A Squared Studio</title>
    <meta
      name="description"
      content="Creare site-uri de prezentare, landing page-uri și portofolii responsive pentru afaceri care vor o imagine profesională online."
    />
    <meta
      name="keywords"
      content="creare site web, site de prezentare, landing page, web design, portofoliu, SEO basic, mentenanță website"
    />

    <meta name="geo.region" content="RO-BV" />
    <meta name="geo.placename" content="Brașov" />
    <meta name="geo.position" content="45.6427;25.5887" />
    <meta name="ICBM" content="45.6427, 25.5887" />

    <link rel="icon" type="image/png" href="/src/assets/logo_wtb.png" />
    <link rel="canonical" href="https://asquaredstudio.ro/" />

    <!-- Hero video is the first thing the user sees; without this the file
         only starts downloading once React mounts and the in-view observer
         fires, which is well after HTML parse. Preloading here starts the
         fetch immediately, in parallel with the JS bundle. -->
    <link
      rel="preload"
      as="video"
      href="/hero/hero-video.mp4"
      type="video/mp4"
      fetchpriority="high"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="A Squared Studio" />
    <meta property="og:title" content="A Squared Studio" />
    <meta
      property="og:description"
      content="Site-uri clare, rapide și bine structurate pentru afaceri care vor o prezență online profesionistă."
    />
    <meta property="og:image" content="/banner site.svg" />
    <meta property="og:locale" content="ro_RO" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A Squared Studio" />
    <meta
      name="twitter:description"
      content="Site-uri clare, rapide și bine structurate pentru afaceri care vor o prezență online profesionistă."
    />
    <meta name="twitter:image" content="/banner site.svg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "A Squared Studio",
        "url": "https://asquaredstudio.ro/",
        "description": "Creare site-uri de prezentare, landing page-uri și portofolii responsive.",
        "inLanguage": "ro-RO"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "A Squared Studio",
        "url": "https://asquaredstudio.ro/",
        "image": "https://asquaredstudio.ro/banner site.svg",
        "email": "asquared.studio@outlook.com",
        "telephone": "+40729818039",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Brașov",
          "addressCountry": "RO"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 45.6427,
          "longitude": 25.5887
        },
        "areaServed": "RO",
        "sameAs": [
          "https://instagram.com/byasqared.studio/",
          "https://facebook.com/profile.php?id=61589528503382",
          "https://linkedin.com/a-squared-studio-33a25340b/"
        ]
      }
    </script>

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.08), transparent 34%),
          #030303;
        color: white;
        transition:
          opacity 0.45s ease,
          visibility 0.45s ease;
      }

      #initial-loader.loader-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .loader-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .loader-logo {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 120px;
        height: 120px;
      }

      /* Same brand blue / accent green as the rest of the site
         (--color-brand / --color-accent in src/index.css) — the loader is
         the first thing painted, before that stylesheet is parsed, so the
         values are inlined here rather than referenced. */
      .loader-ring {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 2px solid rgba(44, 44, 243, 0.25);
        border-top-color: #10b981;
        animation: loader-spin 0.9s linear infinite;
      }

      .loader-logo img {
        width: 64px;
        height: auto;
        position: relative;
        z-index: 1;
      }

      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loader-text {
        font-family: Inter, system-ui, sans-serif;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.55);
      }

      @media (prefers-reduced-motion: reduce) {
        .loader-ring {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="initial-loader">
      <div class="loader-card">
        <div class="loader-logo">
          <div class="loader-ring" aria-hidden="true"></div>
          <img src="/src/assets/logo_wtb.png" alt="Logo" />
        </div>
        <div class="loader-text">Se încarcă experiența...</div>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
