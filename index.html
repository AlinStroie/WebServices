<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030303" />
    <meta name="robots" content="index, follow" />

    <title>A Squared Studio</title>
    <meta
      name="description"
      content="Creare site-uri de prezentare, landing page-uri și portofolii responsive pentru afaceri care vor o imagine profesională online."
    />
    <meta
      name="keywords"
      content="creare site web, site de prezentare, landing page, web design, portofoliu, SEO basic, mentenanță website"
    />

    <meta name="geo.region" content="RO-BV" />
    <meta name="geo.placename" content="Brașov" />
    <meta name="geo.position" content="45.6427;25.5887" />
    <meta name="ICBM" content="45.6427, 25.5887" />

    <link rel="icon" type="image/png" href="/src/assets/logo_wtb.png" />
    <link rel="canonical" href="https://asquaredstudio.ro/" />

    <!-- Hero video is the first thing the user sees; without this the file
         only starts downloading once React mounts and the in-view observer
         fires, which is well after HTML parse. Preloading here starts the
         fetch immediately, in parallel with the JS bundle. -->
    <link
      rel="preload"
      as="video"
      href="/hero/hero-video.mp4"
      type="video/mp4"
      fetchpriority="high"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="A Squared Studio" />
    <meta property="og:title" content="A Squared Studio" />
    <meta
      property="og:description"
      content="Site-uri clare, rapide și bine structurate pentru afaceri care vor o prezență online profesionistă."
    />
    <meta property="og:image" content="/banner site.svg" />
    <meta property="og:locale" content="ro_RO" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A Squared Studio" />
    <meta
      name="twitter:description"
      content="Site-uri clare, rapide și bine structurate pentru afaceri care vor o prezență online profesionistă."
    />
    <meta name="twitter:image" content="/banner site.svg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "A Squared Studio",
        "url": "https://asquaredstudio.ro/",
        "description": "Creare site-uri de prezentare, landing page-uri și portofolii responsive.",
        "inLanguage": "ro-RO"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "A Squared Studio",
        "url": "https://asquaredstudio.ro/",
        "image": "https://asquaredstudio.ro/banner site.svg",
        "email": "contact@asquaredstudio.ro",
        "telephone": "+40729818039",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Brașov",
          "addressCountry": "RO"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 45.6427,
          "longitude": 25.5887
        },
        "areaServed": "RO",
        "sameAs": [
          "https://instagram.com/byasqared.studio/",
          "https://facebook.com/profile.php?id=61589528503382",
          "https://linkedin.com/a-squared-studio-33a25340b/"
        ]
      }
    </script>

    <style>
      /* Skeleton placeholder for the gap between HTML parse and React's
         first paint. Bone-shaped blocks roughly tracing the Hero's glass
         panel (eyebrow / headline / subtitle / CTA row) so the swap to
         real content doesn't jump. Hidden as soon as React has painted —
         see main.jsx — so it's never gated on fonts or video like the old
         spinner was, which is what made LCP take as long as 4.5s on
         mobile. */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        background: #030303;
        transition:
          opacity 0.3s ease,
          visibility 0.3s ease;
      }

      #initial-loader.loader-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .skeleton-panel {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: min(420px, 84vw);
        margin-left: max(24px, 6vw);
      }

      .skeleton-block {
        border-radius: 8px;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.06) 25%,
          rgba(255, 255, 255, 0.14) 37%,
          rgba(255, 255, 255, 0.06) 63%
        );
        background-size: 400% 100%;
        animation: skeleton-shimmer 1.6s ease-in-out infinite;
      }

      .skeleton-eyebrow {
        width: 130px;
        height: 12px;
        border-radius: 999px;
      }

      .skeleton-title {
        height: 30px;
      }

      .skeleton-title--wide {
        width: 100%;
      }

      .skeleton-title--narrow {
        width: 65%;
      }

      .skeleton-subtitle {
        height: 13px;
      }

      .skeleton-subtitle--a {
        width: 90%;
      }

      .skeleton-subtitle--b {
        width: 60%;
        margin-bottom: 8px;
      }

      .skeleton-cta-row {
        display: flex;
        gap: 12px;
      }

      .skeleton-cta {
        width: 150px;
        height: 46px;
        border-radius: 999px;
      }

      .skeleton-cta--ghost {
        width: 130px;
      }

      /* Real text, not another shimmer block — Chrome's First Contentful
         Paint only counts actual text/image/svg content, not background
         colors. Without this, the skeleton (all gradient divs) painted
         nothing FCP could count, pushing FCP out to whenever React's real
         Hero text landed instead of firing immediately like the old
         spinner+label loader did. */
      .skeleton-brand {
        font-family: Inter, system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.82);
        margin-bottom: 4px;
      }

      @keyframes skeleton-shimmer {
        0% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .skeleton-block {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="initial-loader">
      <div class="skeleton-panel" aria-hidden="true">
        <div class="skeleton-brand">A² Studio</div>
        <div class="skeleton-block skeleton-eyebrow"></div>
        <div class="skeleton-block skeleton-title skeleton-title--wide"></div>
        <div class="skeleton-block skeleton-title skeleton-title--narrow"></div>
        <div class="skeleton-block skeleton-subtitle skeleton-subtitle--a"></div>
        <div class="skeleton-block skeleton-subtitle skeleton-subtitle--b"></div>
        <div class="skeleton-cta-row">
          <div class="skeleton-block skeleton-cta"></div>
          <div class="skeleton-block skeleton-cta skeleton-cta--ghost"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
